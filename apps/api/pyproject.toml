[project]
name = "insightflow-api"
version = "0.1.0"
description = "InsightFlow FastAPI application: upload, review, findings and exports"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-orchestration",
    "insightflow-storage",
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
insightflow-api = "insightflow_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_api"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-orchestration = { workspace = true }
insightflow-storage = { workspace = true }

[project]
name = "insightflow-worker"
version = "0.1.0"
description = "Queue worker executing InsightFlow analysis jobs"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-orchestration",
    "insightflow-storage",
    "structlog>=24.4",
]

[project.scripts]
insightflow-worker = "insightflow_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_worker"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-orchestration = { workspace = true }
insightflow-storage = { workspace = true }

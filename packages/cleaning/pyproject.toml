[project]
name = "insightflow-cleaning"
version = "0.1.0"
description = "Deterministic, auditable and reversible data cleaning operations"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-ingestion",
    "polars>=1.17",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_cleaning"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-ingestion = { workspace = true }

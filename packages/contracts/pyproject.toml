[project]
name = "insightflow-contracts"
version = "0.1.0"
description = "Shared Pydantic data contracts for InsightFlow"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_contracts"]

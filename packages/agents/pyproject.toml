[project]
name = "insightflow-agents"
version = "0.1.0"
description = "LLM-backed planner, cleaning planner, verifier and report composer"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-analytics",
    "insightflow-anomaly",
    "insightflow-cleaning",
    "insightflow-features",
    "insightflow-ingestion",
    "insightflow-profiling",
    "insightflow-visualization",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_agents"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-features = { workspace = true }
insightflow-analytics = { workspace = true }
insightflow-anomaly = { workspace = true }
insightflow-cleaning = { workspace = true }
insightflow-ingestion = { workspace = true }
insightflow-profiling = { workspace = true }
insightflow-visualization = { workspace = true }

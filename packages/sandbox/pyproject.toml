[project]
name = "insightflow-sandbox"
version = "0.1.0"
description = "Restricted code runner: AST validation, import allowlist and resource limits"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_sandbox"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }

[project]
name = "insightflow-ingestion"
version = "0.1.0"
description = "Safe ingestion of CSV/XLSX into a normalised internal table representation"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "polars>=1.17",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "python-calamine>=0.3",
    "charset-normalizer>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_ingestion"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }

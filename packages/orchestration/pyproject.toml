[project]
name = "insightflow-orchestration"
version = "0.1.0"
description = "Resumable job state machine wiring ingestion through to verified reporting"
requires-python = ">=3.11"
dependencies = [
    "insightflow-agents",
    "insightflow-analytics",
    "insightflow-anomaly",
    "insightflow-cleaning",
    "insightflow-contracts",
    "insightflow-features",
    "insightflow-ingestion",
    "insightflow-preprocessing",
    "insightflow-profiling",
    "insightflow-reporting",
    "insightflow-sandbox",
    "insightflow-storage",
    "insightflow-visualization",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_orchestration"]

[tool.uv.sources]
insightflow-agents = { workspace = true }
insightflow-analytics = { workspace = true }
insightflow-anomaly = { workspace = true }
insightflow-cleaning = { workspace = true }
insightflow-contracts = { workspace = true }
insightflow-features = { workspace = true }
insightflow-ingestion = { workspace = true }
insightflow-preprocessing = { workspace = true }
insightflow-profiling = { workspace = true }
insightflow-reporting = { workspace = true }
insightflow-sandbox = { workspace = true }
insightflow-storage = { workspace = true }
insightflow-visualization = { workspace = true }

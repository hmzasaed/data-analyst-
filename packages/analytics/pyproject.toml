[project]
name = "insightflow-analytics"
version = "0.1.0"
description = "Registered deterministic analysis tools and the tool registry"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-ingestion",
    "insightflow-anomaly",
    "polars>=1.17",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.6",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_analytics"]

[tool.uv.sources]
insightflow-anomaly = { workspace = true }
insightflow-contracts = { workspace = true }
insightflow-ingestion = { workspace = true }

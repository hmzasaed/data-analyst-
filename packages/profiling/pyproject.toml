[project]
name = "insightflow-profiling"
version = "0.1.0"
description = "Deterministic dataset profiling and data-quality issue detection"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-ingestion",
    "polars>=1.17",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_profiling"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-ingestion = { workspace = true }

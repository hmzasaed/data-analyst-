[project]
name = "insightflow-preprocessing"
version = "0.1.0"
description = "Analysis preprocessing (imputation, outlier capping) and model-ready dataset export"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "polars>=1.17",
    "pyarrow>=17",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_preprocessing"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }

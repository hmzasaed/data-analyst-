[project]
name = "insightflow-visualization"
version = "0.1.0"
description = "Deterministic chart specifications and headless rendering"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "polars>=1.17",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_visualization"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }

[project]
name = "insightflow-storage"
version = "0.1.0"
description = "Owner-scoped artifact store, job state persistence and audit log"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    # PostgreSQL / Supabase backend. Imported lazily, so SQLite installs never load it.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_storage"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
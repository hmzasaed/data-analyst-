[project]
name = "insightflow-reporting"
version = "0.1.0"
description = "HTML, Markdown and JSON report composition from verified findings"
requires-python = ">=3.11"
dependencies = [
    "insightflow-contracts",
    "insightflow-ingestion",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow_reporting"]

[tool.uv.sources]
insightflow-contracts = { workspace = true }
insightflow-ingestion = { workspace = true }
